<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Quantum Finance</title>
<style>
:root {
  --cyan: #00f2ff;
  --magenta: #bc00ff;
  --warning: #ff3c00;
  --safe: #00ff88;
  --bg-deep: #020408;
}

body {
  margin: 0; padding: 0;
  background: var(--bg-deep);
  color: #e2e8f0;
  font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  overflow-x: hidden;
}

/* CYBER BACKGROUND ANIMATION */
body::before {
  content: ""; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  background: 
    linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%),
    linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
  background-size: 100% 2px, 3px 100%; z-index: 1000; pointer-events: none;
}

/* HUD HEADER */
.hud-header {
  padding: 40px 20px;
  background: linear-gradient(180deg, rgba(0, 242, 255, 0.1) 0%, transparent 100%);
  border-bottom: 1px solid rgba(0, 242, 255, 0.2);
  text-align: center;
  backdrop-filter: blur(10px);
}

.glitch-total {
  font-size: 42px; font-weight: 900;
  letter-spacing: -2px;
  color: #fff;
  text-shadow: 2px 2px var(--magenta), -2px -2px var(--cyan);
  margin: 10px 0;
}

.stats-bar {
  display: flex; justify-content: center; gap: 20px; font-size: 10px;
  text-transform: uppercase; letter-spacing: 2px; color: var(--cyan);
}

/* GRID SYSTEM */
.deck {
  display: grid;
  grid-template-columns: 1fr;
  gap: 15px;
  padding: 20px;
  max-width: 500px;
  margin: 0 auto;
}

/* QUANTUM CARD */
.q-card {
  position: relative;
  background: rgba(255, 255, 255, 0.03);
  border: 1px solid rgba(255, 255, 255, 0.1);
  border-radius: 2px 20px 2px 20px;
  padding: 20px;
  transition: 0.3s;
  overflow: hidden;
}

.q-card.unpaid {
  background: rgba(255, 60, 0, 0.03);
  border-color: rgba(255, 60, 0, 0.3);
  animation: pulse-border 2s infinite;
}

@keyframes pulse-border {
  0% { box-shadow: 0 0 0px rgba(255, 60, 0, 0); }
  50% { box-shadow: 0 0 15px rgba(255, 60, 0, 0.2); }
  100% { box-shadow: 0 0 0px rgba(255, 60, 0, 0); }
}

.card-label {
  font-size: 11px; font-weight: 800; color: var(--cyan);
  text-transform: uppercase; margin-bottom: 5px;
}

.card-amount {
  font-size: 24px; font-family: 'Courier New', Courier, monospace;
  font-weight: bold; margin-bottom: 15px;
}

.card-meta {
  display: flex; justify-content: space-between;
  font-size: 10px; border-top: 1px solid rgba(255,255,255,0.05);
  padding-top: 10px; color: #888;
}

/* BIOMETRIC TOGGLE */
.bio-toggle {
  position: absolute; top: 15px; right: 15px;
  display: flex; flex-direction: column; align-items: center;
}

.toggle-input { display: none; }
.toggle-btn {
  width: 40px; height: 40px; border-radius: 50%;
  border: 2px solid #333; display: flex; align-items: center;
  justify-content: center; cursor: pointer; transition: 0.4s;
}

.toggle-input:checked + .toggle-btn {
  border-color: var(--safe); color: var(--safe);
  box-shadow: 0 0 15px var(--safe);
}

.toggle-input:not(:checked) + .toggle-btn {
  border-color: var(--warning); color: var(--warning);
}

.scanner-line {
  position: absolute; top: 0; left: 0; width: 100%; height: 2px;
  background: rgba(0, 242, 255, 0.5);
  box-shadow: 0 0 10px var(--cyan);
  animation: scan 3s linear infinite;
  pointer-events: none;
}

@keyframes scan {
  0% { top: 0%; opacity: 0; }
  50% { opacity: 1; }
  100% { top: 100%; opacity: 0; }
}

</style>
</head>
<body>

<div class="hud-header">
  <div class="stats-bar">
    <span>System: Online</span>
    <span id="cardCount">Cards: 0</span>
  </div>
  <div class="glitch-total" id="mainTotal">₹0</div>
  <div class="stats-bar" style="color:var(--magenta)">Total Liability Scan</div>
</div>

<div class="deck" id="mainDeck">
  </div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbzMl206QgGnE7TEZM6vdog_TtvknkC1B9VsTDwik03f9HewU2496_o1lPBVZvHYRbnqgA/exec";
const formatter = new Intl.NumberFormat('en-IN', { style: 'currency', currency: 'INR', maximumFractionDigits: 0 });

async function loadQuantumGrid() {
  try {
    const res = await fetch(API_URL);
    const data = await res.json();
    
    document.getElementById('cardCount').innerText = `Nodes: ${data.length}`;
    renderDeck(data);
  } catch (e) {
    console.error("Link Failure");
  }
}

function renderDeck(data) {
  const deck = document.getElementById('mainDeck');
  const totalEl = document.getElementById('mainTotal');
  let totalUnpaid = 0;
  let html = '';

  data.forEach(item => {
    const isPaid = item.status.toLowerCase() === 'paid';
    const amt = parseFloat(item.amount) || 0;
    if(!isPaid) totalUnpaid += amt;

    html += `
      <div class="q-card ${isPaid ? 'paid' : 'unpaid'}">
        ${!isPaid ? '<div class="scanner-line"></div>' : ''}
        <div class="card-label">${item.cardName}</div>
        <div class="card-amount">${formatter.format(amt)}</div>
        
        <div class="bio-toggle">
          <label>
            <input type="checkbox" class="toggle-input" ${isPaid ? 'checked' : ''} 
                   onchange="updateNode(${item.row}, this)">
            <div class="toggle-btn">
               ${isPaid ? '✔' : '✕'}
            </div>
          </label>
        </div>

        <div class="card-meta">
          <span>GEN: ${item.billDate}</span>
          <span style="${!isPaid ? 'color:var(--warning)' : ''}">DUE: ${item.dueDate}</span>
        </div>
      </div>
    `;
  });

  deck.innerHTML = html;
  totalEl.innerText = formatter.format(totalUnpaid);
}

async function updateNode(row, el) {
  el.parentElement.style.opacity = "0.3";
  const status = el.checked ? "Paid" : "Unpaid";
  
  try {
    await fetch(API_URL, {
      method: "POST",
      body: JSON.stringify({ row: row, status: status })
    });
    loadQuantumGrid();
  } catch (e) {
    alert("Neural Link Interrupted");
    loadQuantumGrid();
  }
}

loadQuantumGrid();
</script>
</body>
</html>
