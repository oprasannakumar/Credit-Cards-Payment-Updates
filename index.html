<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#080410">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/2092/2092663.png">
<title>Quantum Finance // Slim HUD</title>
<style>
:root {
  --neon-pink: #ff007f;
  --neon-cyan: #00f2ff;
  --neon-purple: #9d00ff;
  --neon-gold: #ffaa00;
  --neon-green: #00ffaa;
  --dark-void: #080410;
  --card-glass: rgba(18, 10, 36, 0.75);
  --glass-border: rgba(255, 255, 255, 0.08);
}

body {
  margin: 0;
  padding: 0;
  background-color: var(--dark-void);
  background-image: 
    linear-gradient(rgba(255, 255, 255, 0.01) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255, 255, 255, 0.01) 1px, transparent 1px),
    radial-gradient(circle at 10% 20%, rgba(157, 0, 255, 0.2) 0%, transparent 45%),
    radial-gradient(circle at 90% 15%, rgba(0, 242, 255, 0.18) 0%, transparent 45%),
    radial-gradient(circle at 50% 85%, rgba(255, 0, 127, 0.15) 0%, transparent 55%);
  background-attachment: fixed;
  background-size: 30px 30px, 30px 30px, 200% 200%, 200% 200%, 200% 200%;
  animation: backgroundDrift 20s linear infinite, nebulaWave 12s ease infinite alternate;
  color: #f1f5f9;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  overflow-x: hidden;
  -webkit-tap-highlight-color: transparent;
}

@keyframes backgroundDrift {
  0% { background-position: 0px 0px, 0px 0px; }
  100% { background-position: 30px 60px, 30px 60px; }
}

@keyframes nebulaWave {
  0% { background-position: center, center, 0% 50%, 100% 50%, 50% 0%; }
  100% { background-position: center, center, 100% 50%, 0% 50%, 50% 100%; }
}

/* REDUCED TOTAL HUD WORKSPACE WIDTH CONTAINER */
.hud-container {
  max-width: 360px;
  margin: 0 auto;
  padding: 12px 10px 60px 10px;
}

.hud-header {
  position: sticky;
  top: 12px;
  z-index: 100;
  background: rgba(22, 12, 44, 0.85);
  border: 1px solid rgba(0, 242, 255, 0.4);
  border-radius: 18px;
  padding: 14px 16px;
  text-align: center;
  backdrop-filter: blur(25px);
  -webkit-backdrop-filter: blur(25px);
  box-shadow: 0 15px 35px rgba(0, 0, 0, 0.8), 0 0 25px rgba(0, 242, 255, 0.15);
  margin-bottom: 16px;
  transform: translateZ(0);
}

.system-status {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 9px;
  font-family: 'Courier New', monospace;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: #a78bfa;
  margin-bottom: 2px;
}

.status-indicator {
  display: flex;
  align-items: center;
  gap: 6px;
}

.status-pulse-ring {
  width: 8px;
  height: 8px;
  background-color: var(--neon-green);
  border-radius: 50%;
  position: relative;
}

.status-pulse-ring::after {
  content: '';
  position: absolute;
  inset: -3px;
  border: 1.5px solid var(--neon-green);
  border-radius: 50%;
  animation: wavePing 1.5s cubic-bezier(0, 0, 0.2, 1) infinite;
}

@keyframes wavePing {
  0% { transform: scale(1); opacity: 1; }
  100% { transform: scale(2.2); opacity: 0; }
}

.glitch-total {
  font-size: 30px;
  font-weight: 900;
  letter-spacing: -1px;
  background: linear-gradient(135deg, #ffffff 40%, #ff80df 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  margin: 2px 0;
}

.total-label {
  font-size: 8.5px;
  text-transform: uppercase;
  letter-spacing: 0.15em;
  color: var(--neon-cyan);
  font-weight: 800;
  text-shadow: 0 0 8px rgba(0, 242, 255, 0.4);
}

.deck {
  display: grid;
  grid-template-columns: 1fr;
  gap: 10px;
}

/* ULTRA-COMPACT SLIM CARDS PROPERTIES */
.q-card {
  position: relative;
  background: var(--card-glass);
  border-radius: 12px;
  padding: 12px 14px;
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), border-color 0.3s, box-shadow 0.3s;
  border: 1px solid var(--glass-border);
}

.q-card.unpaid {
  border-color: transparent;
  background: linear-gradient(var(--dark-void), var(--dark-void)) padding-box,
              linear-gradient(var(--angle, 0deg), var(--neon-pink), var(--neon-purple), var(--neon-cyan), var(--neon-pink)) border-box;
  animation: rotateBorder 4s linear infinite, dynamicPulse 2.5s ease-in-out infinite alternate;
}

@property --angle {
  syntax: '<angle>';
  initial-value: 0deg;
  inherits: false;
}

@keyframes rotateBorder {
  to { --angle: 360deg; }
}

@keyframes dynamicPulse {
  0% { box-shadow: 0 6px 15px -5px rgba(255, 0, 127, 0.2); }
  100% { box-shadow: 0 10px 20px -2px rgba(0, 242, 255, 0.25); }
}

.q-card.paid {
  border-color: rgba(0, 255, 170, 0.18);
  box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
  background: rgba(10, 25, 20, 0.25);
}

.q-card:active {
  transform: scale(0.97) !important;
}

.card-label {
  font-size: 12px;
  font-weight: 800;
  color: #ffffff;
  margin-bottom: 1px;
  text-shadow: 0 1px 2px rgba(0,0,0,0.4);
  max-width: 75%;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.card-amount {
  font-size: 20px;
  font-family: 'Courier New', monospace;
  font-weight: 700;
  color: #ffffff;
  margin-bottom: 4px;
}

.card-outstanding {
  font-size: 9.5px;
  color: #94a3b8;
  background: rgba(0, 0, 0, 0.3);
  padding: 3px 8px;
  border-radius: 5px;
  display: inline-flex;
  align-items: center;
  gap: 4px;
}

.card-outstanding span {
  color: var(--neon-cyan);
  font-weight: 800;
}

.q-card.unpaid .card-outstanding span {
  color: var(--neon-gold);
}

.bio-toggle {
  position: absolute;
  top: 12px;
  right: 12px;
  z-index: 10;
}

.toggle-input { display: none; }

.toggle-btn {
  width: 28px;
  height: 28px;
  border-radius: 8px;
  background: rgba(0, 0, 0, 0.5);
  border: 1px solid rgba(255, 255, 255, 0.15);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  font-size: 11px;
}

.toggle-input:checked + .toggle-btn {
  border-color: var(--neon-green);
  color: var(--neon-green);
  background: rgba(0, 255, 170, 0.1);
}

.toggle-input:not(:checked) + .toggle-btn {
  border-color: var(--neon-pink);
  color: var(--neon-pink);
  background: rgba(255, 0, 127, 0.1);
}

.card-meta {
  display: flex;
  justify-content: space-between;
  border-top: 1px solid rgba(255, 255, 255, 0.08);
  padding-top: 6px;
  margin-top: 8px;
  font-size: 10px;
  font-family: 'Courier New', monospace;
  color: #94a3b8;
}

.meta-block {
  display: flex;
  flex-direction: column;
}

.meta-block .meta-label {
  font-size: 7.5px;
  color: #64748b;
  text-transform: uppercase;
}

.meta-block .meta-val {
  color: #cbd5e1;
}

.q-card.unpaid .due-block .meta-val {
  color: #ff73b3;
  font-weight: 700;
}
</style>
</head>
<body>

<div class="hud-container">

  <div class="hud-header">
    <div class="system-status">
      <div class="status-indicator">
        <div class="status-pulse-ring"></div>
        <span>Sync.Active</span>
      </div>
      <div id="cardCount">Cards: --</div>
    </div>
    <div class="glitch-total" id="mainTotal">₹0</div>
    <div class="total-label">Prismatic Debt Index</div>
  </div>

  <div class="deck" id="mainDeck"></div>

</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbwSR9-Kgq6dMjoOg0dSiJ_mXsFlrIz6qkw8BkeJQC0lwjDuEhTW_nvKhsrmGKzag732CA/exec";
const formatter = new Intl.NumberFormat('en-IN', { style: 'currency', currency: 'INR', maximumFractionDigits: 0 });

function formatDateToQuantum(dateStr) {
  if (!dateStr) return "N/A";
  if (typeof dateStr === 'string' && dateStr.includes('/')) {
    const parts = dateStr.split('/');
    if (parts.length === 3 && isNaN(parts[1])) return dateStr; 
  }
  const months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
  let dateObj = new Date(dateStr);
  if (isNaN(dateObj.getTime())) {
    let cleanStr = String(dateStr).split('T')[0].trim();
    let p = cleanStr.split(/[-/.]/);
    if (p.length < 3) return dateStr;
    if (p[0].length === 4) { dateObj = new Date(p[0], parseInt(p[1]) - 1, p[2]); } 
    else { dateObj = new Date(p[2], parseInt(p[1]) - 1, p[0]); }
  }
  if (isNaN(dateObj.getTime())) return dateStr;
  return `${dateObj.getDate()}/${months[dateObj.getMonth()]}/${dateObj.getFullYear()}`;
}

async function loadQuantumGrid() {
  try {
    const res = await fetch(API_URL);
    const data = await res.json();
    document.getElementById('cardCount').innerText = `Cards: ${data.length}`;
    renderDeck(data);
  } catch (e) { 
    console.error("Link Failure", e);
    document.getElementById('mainDeck').innerHTML = `<div style="text-align:center; color:var(--neon-pink); font-family:'Courier New', monospace; padding:20px; font-size:11px;">SECURE LINK LOST.</div>`;
  }
}

function renderDeck(data) {
  const deck = document.getElementById('mainDeck');
  const totalEl = document.getElementById('mainTotal');
  let totalUnpaid = 0;
  let html = '';

  data.sort((a, b) => {
    const aPaid = a.status && a.status.toLowerCase() === 'paid';
    const bPaid = b.status && b.status.toLowerCase() === 'paid';
    return aPaid - bPaid;
  });

  data.forEach(item => {
    const isPaid = item.status && item.status.toLowerCase() === 'paid';
    const amt = parseFloat(item.amount) || 0;
    const outstanding = parseFloat(item.outstanding) || 0; 

    if(!isPaid) totalUnpaid += amt;
    
    const displayBill = formatDateToQuantum(item.billDate);
    const displayDue = formatDateToQuantum(item.dueDate);

    html += `
      <div class="q-card ${isPaid ? 'paid' : 'unpaid'}">
        <div class="card-label">${item.cardName || 'Quantum Ledger'}</div>
        <div class="card-amount">${formatter.format(amt)}</div>
        <div class="card-outstanding">Bal: <span>${formatter.format(outstanding)}</span></div>

        <div class="bio-toggle">
          <label>
            <input type="checkbox" class="toggle-input" ${isPaid ? 'checked' : ''} 
                   onchange="updateNode(${item.row}, '${displayBill}', '${displayDue}', this)">
            <div class="toggle-btn">${isPaid ? '✔' : '✕'}</div>
          </label>
        </div>

        <div class="card-meta">
          <div class="meta-block">
            <span class="meta-label">Bill Date</span>
            <span class="meta-val">${displayBill}</span>
          </div>
          <div class="meta-block due-block">
            <span class="meta-label">Due Date</span>
            <span class="meta-val">${displayDue}</span>
          </div>
        </div>
      </div>`;
  });
  
  if (totalEl.innerText !== formatter.format(totalUnpaid)) {
    totalEl.style.textShadow = "0 0 25px var(--neon-cyan), 0 0 10px #ffffff";
    setTimeout(() => { totalEl.style.textShadow = "none"; }, 400);
  }
  
  deck.innerHTML = html;
  totalEl.innerText = formatter.format(totalUnpaid);
}

async function updateNode(row, billDate, dueDate, el) {
  const parentCard = el.closest('.q-card');
  parentCard.style.opacity = "0.3";
  parentCard.style.transform = "scale(1.03)";
  
  const status = el.checked ? "Paid" : "Unpaid";
  try {
    await fetch(API_URL, { 
      method: "POST", 
      mode: "no-cors", 
      body: JSON.stringify({ row: row, status: status, billDate: billDate, dueDate: dueDate }) 
    });
    setTimeout(loadQuantumGrid, 500);
  } catch (e) { 
    alert("TRANSACTION DROPPED."); 
    loadQuantumGrid(); 
  }
}

loadQuantumGrid();
</script>
</body>
</html>
